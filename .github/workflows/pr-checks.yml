name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev]

jobs:
  # ========== 1. 代码格式检查 ==========
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Go Lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./...

      - name: Set up C Lint (clang-format)
        run: sudo apt-get install -y clang-format

      - name: C/C++ Format Check
        run: |
          find . -name "*.c" -o -name "*.h" -o -name "*.cpp" -o -name "*.hpp" | \
          xargs clang-format --dry-run --Werror

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.1'

      - name: Haxe Format Check
        run: haxe --check-files src/**/*.hx

  # ========== 2. 编译检查 ==========
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Go Components
        run: |
          go build -v ./cmd/ela/...
          go build -v ./cmd/lhyper/...

      - name: Set up C Build
        run: sudo apt-get install -y build-essential libgl1-mesa-dev

      - name: Build C Components
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.1'

      - name: Build Haxe Components (CPP)
        run: |
          haxe build-cpp.hxml

      - name: Build Haxe Components (JVM)
        run: |
          haxe build-jvm.hxml

      - name: Build Haxe Components (HL)
        run: |
          haxe build-hl.hxml

      - name: Verify ELRA JAR
        run: |
          ls -la bin/ | grep "\.jar$" || exit 1

  # ========== 3. 单元测试 ==========
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Go Test
        run: go test -v -cover ./...

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: '4.3.1'

      - name: Haxe Test
        run: haxe test.hxml

  # ========== 4. 安全与合规检查 ==========
  security:
    name: Security & Compliance
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Go Security Check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Check for JVM languages
        run: |
          if find . -name "*.java" -o -name "*.kt" -o -name "*.scala" | grep -v "src/elra/"; then
            echo "❌ Found JVM files outside ELRA registry layer"
            exit 1
          fi

      - name: Check for script languages
        run: |
          if find . -name "*.py" -o -name "*.lua" -o -name "*.rb" -o -name "*.js" | grep -v "docs/"; then
            echo "⚠️  Warning: Script files detected"
          fi

      - name: Check for Haxe transpiled files
        run: |
          if find . -name "*.java" -path "*/src/haxe/*" -o -name "*.cpp" -path "*/src/haxe/*"; then
            echo "❌ Transpiled files from Haxe should not be committed"
            exit 1
          fi

      - name: Check for C++ files
        run: |
          cpp_count=$(find . -name "*.cpp" -o -name "*.hpp" | wc -l)
          if [ $cpp_count -gt 10 ]; then
            echo "⚠️  C++ files detected: $cpp_count. Please keep C++ to a minimum."
          fi

  # ========== 5. 注册表逻辑检查 ==========
  registry:
    name: Registry Logic Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SQLite
        run: sudo apt-get install -y sqlite3

      - name: Verify ELRA schema
        run: |
          sqlite3 :memory: < scripts/elra_schema.sql
          echo "✅ ELRA schema validated"

      - name: Check registry isolation
        run: |
          if grep -r "Windows Registry" --include="*.c" --include="*.go" --include="*.hx" .; then
            echo "❌ ELA must not touch Windows Registry. Use ELRA instead."
            exit 1
          fi

  # ========== 6. 构建大小检查 ==========
  size:
    name: Binary Size Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build and check size
        run: |
          go build -o ela-test ./cmd/ela/...
          size=$(ls -lh ela-test | awk '{print $5}')
          echo "Binary size: $size"
          if [ $(stat -c%s ela-test) -gt 100000000 ]; then
            echo "⚠️  Binary size exceeds 100MB. Consider optimizing."
          fi

  # ========== 7. 最终状态 ==========
  final:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, build, test, security, registry, size]
    if: always()
    steps:
      - name: Check status
        run: |
          echo "## ✅ PR Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | ${{ needs.registry.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | ${{ needs.size.result }} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.lint.result }}" != "success" || \
                "${{ needs.build.result }}" != "success" || \
                "${{ needs.test.result }}" != "success" || \
                "${{ needs.security.result }}" != "success" || \
                "${{ needs.registry.result }}" != "success" || \
                "${{ needs.size.result }}" != "success" ]]; then
            exit 1
          fi
