name: Build ELA for Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup MinGW
        run: |
          choco install mingw -y
          echo "C:\ProgramData\chocolatey\bin" >> $GITHUB_PATH

      - name: Build
        run: |
          go mod download
          go build -o bin/ela-gui.exe ./cmd/ela

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ela-windows
          path: bin/ela-gui.exe
